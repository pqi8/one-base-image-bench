# T3 Code build and typecheck on GitHub's hosted arm64 runner (ubuntu-24.04-arm: 4 vCPU, 16 GB for public repos).
# Warm runs restore .bench-cache with actions/cache; a seed run saves it.
name: t3code

on:
  workflow_dispatch:
    inputs:
      cache:
        description: cold or warm
        default: cold
      save_cache:
        description: save .bench-cache after the run (seed run)
        default: "false"

jobs:
  bench:
    name: "T3 Code build and typecheck (${{ inputs.cache }})"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      BENCH_PLATFORM: github-actions
      BENCH_CACHE: ${{ inputs.cache }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore .bench-cache
        if: inputs.cache == 'warm'
        uses: actions/cache/restore@v4
        with:
          path: .bench-cache
          key: bench-t3code-v1
      - name: Bench
        run: bash bench/t3code.sh
      - name: Save .bench-cache
        if: always() && inputs.save_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: .bench-cache
          key: bench-t3code-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: artifacts
          if-no-files-found: ignore
