# buildkite/agent tests + linux/arm64 build on Buildkite hosted agents, Linux arm64, 4 vCPU / 16 GB.
# Warm runs attach a cache volume holding .bench-cache; cold runs attach none.
env:
  BENCH_PLATFORM: buildkite-hosted

steps:
  - label: ":go: buildkite/agent tests + linux/arm64 build (cold)"
    if: build.env("BENCH_CACHE") != "warm"
    command: bash bench/agent.sh
    agents:
      queue: HOSTED_QUEUE
    artifact_paths: ["artifacts/**/*"]
    timeout_in_minutes: 45

  - label: ":go: buildkite/agent tests + linux/arm64 build (warm)"
    if: build.env("BENCH_CACHE") == "warm"
    command: bash bench/agent.sh
    agents:
      queue: HOSTED_QUEUE
    cache:
      name: bench-agent
      paths: [".bench-cache"]
      size: 20g
    artifact_paths: ["artifacts/**/*"]
    timeout_in_minutes: 45
