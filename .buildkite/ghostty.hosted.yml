# libghostty Linux build + lib-vt tests on Buildkite hosted agents, Linux arm64, 4 vCPU / 16 GB.
# Warm runs attach a cache volume holding .bench-cache; cold runs attach none.
env:
  BENCH_PLATFORM: buildkite-hosted

steps:
  - label: ":zap: libghostty Linux build + lib-vt tests (cold)"
    if: build.env("BENCH_CACHE") != "warm"
    command: bash bench/ghostty.sh
    agents:
      queue: hosted-linux-arm64
    artifact_paths: ["artifacts/**/*"]
    timeout_in_minutes: 45

  - label: ":zap: libghostty Linux build + lib-vt tests (warm)"
    if: build.env("BENCH_CACHE") == "warm"
    command: bash bench/ghostty.sh
    agents:
      queue: hosted-linux-arm64
    cache:
      name: bench-ghostty
      paths: [".bench-cache"]
      size: 20g
    artifact_paths: ["artifacts/**/*"]
    timeout_in_minutes: 45
