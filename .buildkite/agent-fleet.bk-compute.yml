# Fleet test: buildkite/agent's CI split into its upstream jobs (lint, 2 test shards,
# 3 race shards, 5 binaries), on Patrick's Mac: 2 Medium VMs (local-macs-medium) and
# 1 Small VM (local-macs-small). Each size has its own queue, so each job is assigned
# one: the Small VM gets the jobs it ran in earlier shared-queue runs (lint and three binaries).
env:
  BENCH_PLATFORM: bk-compute

steps:
  - label: ":go: Lint"
    command: bash bench/agent-fleet.sh lint
    agents: { queue: local-macs-small, host: patricks-macbook-pro }
  - label: ":linux: Tests %n"
    parallelism: 2
    command: bash bench/agent-fleet.sh test $$BUILDKITE_PARALLEL_JOB $$BUILDKITE_PARALLEL_JOB_COUNT
    agents: { queue: local-macs-medium, host: patricks-macbook-pro }
  - label: ":satellite: Races %n"
    parallelism: 3
    # The race detector needs several times the memory of a plain test run (upstream asks for medium).
    command: bash bench/agent-fleet.sh race $$BUILDKITE_PARALLEL_JOB $$BUILDKITE_PARALLEL_JOB_COUNT
    agents: { queue: local-macs-medium, host: patricks-macbook-pro }
  - label: ":package: Build {{matrix.os}}/{{matrix.arch}}"
    command: bash bench/agent-fleet.sh build {{matrix.os}} {{matrix.arch}}
    agents: { queue: local-macs-medium, host: patricks-macbook-pro }
    matrix:
      setup:
        os: [linux, windows]
        arch: [amd64, arm64]
      adjustments:
        - with: { os: windows, arch: arm64 }
          skip: true
        - with: { os: linux, arch: amd64 }
          skip: true
  - label: ":package: Build {{matrix.os}}/{{matrix.arch}}"
    command: bash bench/agent-fleet.sh build {{matrix.os}} {{matrix.arch}}
    agents: { queue: local-macs-small, host: patricks-macbook-pro }
    matrix:
      setup:
        os: [linux, darwin]
        arch: [amd64, arm64]
      adjustments:
        - with: { os: linux, arch: arm64 }
          skip: true
