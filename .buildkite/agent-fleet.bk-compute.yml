# Fleet test: buildkite/agent's CI split into its upstream jobs (lint, 2 test shards,
# 3 race shards, 5 binaries).
# All jobs go to Patrick's Mac on local-macs: its 2 Medium and 1 Small VM share them.
env:
  BENCH_PLATFORM: bk-compute

steps:
  - label: ":go: Lint"
    command: bash bench/agent-fleet.sh lint
    agents: { queue: local-macs, host: patricks-macbook-pro }
  - label: ":linux: Tests %n"
    parallelism: 2
    command: bash bench/agent-fleet.sh test $$BUILDKITE_PARALLEL_JOB $$BUILDKITE_PARALLEL_JOB_COUNT
    agents: { queue: local-macs, host: patricks-macbook-pro }
  - label: ":satellite: Races %n"
    parallelism: 3
    # The race detector needs several times the memory of a plain test run (upstream asks for medium).
    command: bash bench/agent-fleet.sh race $$BUILDKITE_PARALLEL_JOB $$BUILDKITE_PARALLEL_JOB_COUNT
    agents: { queue: local-macs, host: patricks-macbook-pro, size: medium }
  - label: ":package: Build {{matrix.os}}/{{matrix.arch}}"
    command: bash bench/agent-fleet.sh build {{matrix.os}} {{matrix.arch}}
    agents: { queue: local-macs, host: patricks-macbook-pro }
    matrix:
      setup:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
      adjustments:
        - with: { os: windows, arch: arm64 }
          skip: true
